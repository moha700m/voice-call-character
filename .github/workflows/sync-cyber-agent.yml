name: Sync Cyber Agent

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-cyber-agent.yml'

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect ElevenLabs voices
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            'https://api-v2.appdeploy.ai/app/elevenlabs-studio-6onq7g/api/voices' \
            | jq '.voices[:20] | map({voiceId,name,category,labels})'
