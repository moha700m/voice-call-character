name: Probe Vibi CORS for GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/vibi-cors-probe.mjs'
      - '.github/workflows/vibi-cors-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Probe CORS
        run: node tools/vibi-cors-probe.mjs
