name: Deep Probe Vibi API Docs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/vibi-deep-probe.mjs'
      - '.github/workflows/vibi-deep-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run deep Vibi probe
        run: node tools/vibi-deep-probe.mjs

      - name: Upload deep probe artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vibi-deep-probe
          path: artifacts/vibi-deep-probe
          if-no-files-found: warn
          retention-days: 7
