name: Diagnose AppDeploy Proxy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-appdeploy-proxy.yml'
      - 'tools/diagnose-appdeploy-proxy.mjs'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Diagnose proxy
        run: node tools/diagnose-appdeploy-proxy.mjs
